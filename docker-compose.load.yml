# Load-test overlay (Step 13). Runs the PRODUCTION api image (compiled JS, no file
# watcher, no source bind mount) with quiet logging and rate limits effectively off,
# against its own Postgres/Redis volumes so dev data is never touched.
#
#   docker compose -p planner-load -f docker-compose.yml -f docker-compose.load.yml \
#     up -d --build postgres redis api
#
# Use with API_PORT=4100 POSTGRES_PORT=5433 REDIS_PORT=6380 so it can run beside the dev stack.
# NOT for real deployments: the JWT secret below is public and rate limits are disabled.
services:
  api:
    build:
      context: ./api
      target: prod
    environment:
      NODE_ENV: production
      JWT_SECRET: load-test-only-secret-do-not-use-anywhere-else-0123456789
      LOG_LEVEL: warn
      RATE_LIMIT_GLOBAL: "100000000"
      RATE_LIMIT_REGISTER: "100000"
    volumes: !reset []
  web:
    profiles: ["never"]
  api2:
    profiles: ["never"]
